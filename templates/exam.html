<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЕГЭ Математика — Вариант</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Интерактивный Canvas на заднем плане */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* Увеличенный отступ между карточками заданий */
        .task-card {
            margin-bottom: 2.5rem !important;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            background-color: rgba(33, 37, 41, 0.88) !important; /* Легкая прозрачность для показа фона */
            backdrop-filter: blur(4px);
        }

        /* Фиксированная плашка с таймером вверху */
        .timer-badge {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
        }
    </style>
</head>
<body class="bg-dark text-light min-vh-100 p-4 position-relative">

    <!-- Canvas для интерактивных плавающих кружков -->
    <canvas id="bgCanvas"></canvas>

    <!-- Закрепленный плавающий таймер -->
    <div class="badge bg-dark border border-primary text-light p-3 timer-badge" id="timerBox">
        Осталось: <span id="timer" class="text-primary fw-bold">00:00:00</span>
    </div>

    <div class="container" style="max-width: 900px; padding-top: 20px;">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h2>Вариант ЕГЭ (Профиль)</h2>
            <a href="/" class="btn btn-outline-secondary">Прервать и выйти</a>
        </div>

        <form method="POST" action="/check" id="examForm">
            <input type="hidden" name="mode" value="{{ mode }}">

            {% for task in tasks %}
            <!-- Карточка задания с увеличенным отступом .task-card -->
            <div class="card text-light border-secondary p-4 task-card">
                <div class="card-body">
                    <h5 class="card-title text-primary mb-3">Задание №{{ loop.index }} — {{ task.topic }}</h5>
                    <p class="card-text fs-5" style="white-space: pre-line;">{{ task.text }}</p>

                                        <!-- Вывод чертежа / рисунка при наличии -->
                    {% if task.image_url and task.image_url.strip() %}
                    <div class="my-4 text-center">
                        <img src="{{ task.image_url }}"
                             alt=""
                             class="img-fluid rounded border border-secondary"
                             style="max-height: 380px;"
                             onerror="this.parentElement.style.display='none';">
                    </div>
                    {% endif %}

                    <div class="mt-4">
                        <label class="form-label text-muted">Ваш ответ:</label>
                        <input type="text" name="answer_{{ task.id }}" class="form-control form-control-lg bg-secondary text-light border-0" placeholder="Введите ответ">
                    </div>
                </div>
            </div>
            {% endfor %}

            <div class="text-center my-5">
                <button type="submit" class="btn btn-primary btn-lg px-5 py-3 fs-4">Завершить и проверить</button>
            </div>
        </form>
    </div>

    <!-- Логика таймера -->
    <script>
        const mode = "{{ mode }}";

        // Время: 1 час для Части 1; 3ч 55мин для Полного варианта; 30 минут для слабых мест
        let totalSeconds = 60 * 60;

        if (mode === 'full') {
            totalSeconds = (3 * 3600) + (55 * 60);
        } else if (mode === 'weak_spots') {
            totalSeconds = 30 * 60;
        }

        const timerDisplay = document.getElementById('timer');
        const examForm = document.getElementById('examForm');

        function updateTimer() {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            const hDisplay = hours < 10 ? '0' + hours : hours;
            const mDisplay = minutes < 10 ? '0' + minutes : minutes;
            const sDisplay = seconds < 10 ? '0' + seconds : seconds;

            timerDisplay.textContent = `${hDisplay}:${mDisplay}:${sDisplay}`;

            if (totalSeconds <= 300) {
                timerDisplay.className = 'text-danger fw-bold';
            }

            if (totalSeconds <= 0) {
                clearInterval(timerInterval);
                alert("Время вышло! Вариант автоматически отправляется на проверку.");
                examForm.submit();
            } else {
                totalSeconds--;
            }
        }

        updateTimer();
        const timerInterval = setInterval(updateTimer, 1000);
    </script>

<!-- Интерактивный скрипт кружков с паутинкой (черные точки + белая паутинка) -->
    <script>
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Отслеживание курсора мыши
        const mouse = {
            x: null,
            y: null,
            radius: 150 // Радиус связывания с мышью
        };

        window.addEventListener('mousemove', function(event) {
            mouse.x = event.clientX;
            mouse.y = event.clientY;
        });

        window.addEventListener('mouseleave', function() {
            mouse.x = null;
            mouse.y = null;
        });

        // Класс плавающего кружка
        class Particle {
            constructor(id) {
                this.id = id; // Уникальный идентификатор точки
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.radius = Math.random() * 3 + 1.5;
                this.vx = (Math.random() - 0.5) * 1.2;
                this.vy = (Math.random() - 0.5) * 1.2;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.fill();
            }

            update() {
                // Отскок от краев экрана
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

                this.x += this.vx;
                this.y += this.vy;

                this.draw();
            }
        }

        // Создаем массив частиц
        const particleCount = Math.floor((canvas.width * canvas.height) / 10000);
        const particles = [];
        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle(i));
        }

        // Отрисовка БЕЛОЙ паутинки между разными точками и курсором
        function connect() {
            for (let i = 0; i < particles.length; i++) {
                // Соединение только с ДРУГИМИ точками (j = i + 1 исключает самосоединение)
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    // Соединяем точки между собой, если они достаточно близко
                    if (distance < 110) {
                        const opacity = 1 - (distance / 110);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${opacity * 0.4})`; // БЕЛАЯ ЛИНИЯ
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }

                // Соединение с курсором мыши
                if (mouse.x !== null && mouse.y !== null) {
                    const mdx = particles[i].x - mouse.x;
                    const mdy = particles[i].y - mouse.y;
                    const mDistance = Math.sqrt(mdx * mdx + mdy * mdy);

                    if (mDistance < mouse.radius) {
                        const mOpacity = 1 - (mDistance / mouse.radius);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${mOpacity * 0.75})`; // БЕЛАЯ ЛИНИЯ К МЫШИ
                        ctx.lineWidth = 1.2;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(mouse.x, mouse.y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => p.update());
            connect();
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
